name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend — Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_meal_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Backend Sources
        working-directory: backend
        run: |
          find src/main/java -name "*.java" > sources.txt
          mkdir -p out
          javac -d out -cp "lib/*" @sources.txt

      - name: Initialize DB Schema & Seed Data
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: student_meal_app
        run: java -cp "out:lib/*" com.mealapp.tools.InitDb

      - name: Run Backend Integration & AI Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: student_meal_app
          JWT_SECRET: ci-test-secret
          PORT: 4000
        run: |
          java -cp "out:lib/*" com.mealapp.Main &
          SERVER_PID=$!
          sleep 3
          
          find src/test/java -name "*.java" > test_sources.txt
          javac -d out -cp "out:lib/*" @test_sources.txt
          java -cp "out:lib/*" org.junit.platform.console.ConsoleLauncher --select-class com.mealapp.FeatureIntegrationTest
          
          kill $SERVER_PID

  frontend-e2e:
    name: Frontend — Static Checks & Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Syntax-check JS Files
        run: |
          for f in $(find frontend/js -name "*.js"); do
            node --check "$f"
          done

      - name: Install Playwright & Browsers
        working-directory: frontend
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test tests/e2e.spec.js