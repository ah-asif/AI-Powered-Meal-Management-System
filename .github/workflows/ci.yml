name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend (Java) — compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile all sources
        working-directory: backend
        run: |
          find src/main/java -name "*.java" > sources.txt
          mkdir -p out
          javac -d out -cp "lib/*" @sources.txt

  integration-test:
    name: Backend (Java) — integration test against real PostgreSQL
    runs-on: ubuntu-latest
    needs: backend-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_meal_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile
        working-directory: backend
        run: |
          find src/main/java -name "*.java" > sources.txt
          mkdir -p out
          javac -d out -cp "lib/*" @sources.txt

      - name: Initialize schema + seed data
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: student_meal_app
        run: java -cp "out:lib/*" com.mealapp.tools.InitDb

      - name: Boot the API and smoke-test key endpoints
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: student_meal_app
          JWT_SECRET: ci-test-secret
          PORT: 4000
        run: |
          java -cp "out:lib/*" com.mealapp.Main &
          SERVER_PID=$!
          sleep 3

          echo "Health check:"
          curl -sf http://localhost:4000/api/health

          echo "Login as seeded demo student:"
          TOKEN=$(curl -sf -X POST http://localhost:4000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"student@meal.app","password":"Student@123"}' | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")

          echo "Sequential AI food suggestion (core feature):"
          curl -sf -X POST http://localhost:4000/api/students/foods/suggest \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"selectedItemIds":[],"excludedItemIds":[]}'

          kill $SERVER_PID

  frontend-lint:
    name: Frontend — basic HTML/JS sanity checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18 (for `node --check` only — the app itself needs no Node)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Syntax-check frontend JS files
        run: |
          for f in $(find frontend/js -name "*.js"); do
            node --check "$f"
          done

      - name: Check all HTML files reference existing assets
        run: |
          for f in frontend/*.html; do
            echo "Checking $f"
            grep -o 'src="[^"]*"' "$f" | sed 's/src="//;s/"//' | while read -r asset; do
              case "$asset" in
                http*) continue ;;
              esac
              if [ ! -f "frontend/$asset" ]; then
                echo "Missing asset referenced in $f: $asset"
                exit 1
              fi
            done
          done
