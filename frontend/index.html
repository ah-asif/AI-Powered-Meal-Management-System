<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Meal & Budget Planner — Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:22px;">
        <div class="brand" style="justify-content:center; font-size:24px;">
          <span class="tag">$</span> MealLedger
        </div>
        <p style="margin-top:8px;">The most food for the least money — planned by an AI agent that never overspends.</p>
      </div>

      <div class="card">
        <div class="auth-tabs">
          <button id="tabLogin" class="active" type="button">Sign in</button>
          <button id="tabRegister" type="button">Create account</button>
        </div>

        <div id="errorBanner" class="error-banner"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="student@meal.app" required>
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••" required>
          <button class="btn block" style="margin-top:18px;" type="submit" id="loginBtn">Sign in</button>
          <p style="font-size:12px; margin-top:14px; text-align:center;">
            Demo: <strong>student@meal.app</strong> / Student@123 &nbsp;·&nbsp; <strong>admin@meal.app</strong> / Admin@123
          </p>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display:none;">
          <label for="regName">Full name</label>
          <input id="regName" type="text" placeholder="Alex Rivera" required>
          <label for="regEmail">Email</label>
          <input id="regEmail" type="email" placeholder="you@campus.edu" required>
          <label for="regPassword">Password</label>
          <input id="regPassword" type="password" placeholder="At least 8 characters" required minlength="6">
          <div class="form-row">
            <div>
              <label for="regRole">I am a</label>
              <select id="regRole">
                <option value="STUDENT">Student</option>
                <option value="ADMIN">Admin</option>
              </select>
            </div>
            <div id="budgetField">
              <label for="regBudget">Weekly budget ($)</label>
              <input id="regBudget" type="number" min="0" step="0.5" placeholder="50">
            </div>
          </div>
          <div id="dietField">
            <label for="regDiet">Dietary preference</label>
            <select id="regDiet">
              <option value="none">No preference</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="vegan">Vegan</option>
              <option value="halal">Halal</option>
            </select>
          </div>
          <button class="btn block" style="margin-top:18px;" type="submit" id="registerBtn">Create account</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) {
    const u = Auth.getUser();
    window.location.href = (u && u.role === 'ADMIN') ? 'admin.html' : 'dashboard.html';
  }

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabRegister.classList.remove('active');
    loginForm.style.display = 'block'; registerForm.style.display = 'none';
    showError('errorBanner', null);
  });
  tabRegister.addEventListener('click', () => {
    tabRegister.classList.add('active'); tabLogin.classList.remove('active');
    registerForm.style.display = 'block'; loginForm.style.display = 'none';
    showError('errorBanner', null);
  });

  document.getElementById('regRole').addEventListener('change', (e) => {
    const isStudent = e.target.value === 'STUDENT';
    document.getElementById('budgetField').style.display = isStudent ? 'block' : 'none';
    document.getElementById('dietField').style.display = isStudent ? 'block' : 'none';
  });

  function goToRoleHome(user) {
    window.location.href = user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('errorBanner', null);
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
    try {
      const { token, user } = await Api.login({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value,
      });
      Auth.setToken(token); Auth.setUser(user);
      goToRoleHome(user);
    } catch (err) {
      showError('errorBanner', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('errorBanner', null);
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Creating account…';
    try {
      const role = document.getElementById('regRole').value;
      const payload = {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        role,
      };
      if (role === 'STUDENT') {
        payload.budgetLimit = Number(document.getElementById('regBudget').value) || 0;
        payload.dietaryPreference = document.getElementById('regDiet').value;
      }
      const { token, user } = await Api.register(payload);
      Auth.setToken(token); Auth.setUser(user);
      goToRoleHome(user);
    } catch (err) {
      showError('errorBanner', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
