server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend API container so the browser can call
    # same-origin /api/... instead of needing CORS / a hardcoded host:port.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets briefly; HTML always revalidates
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
